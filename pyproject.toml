[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edicao_pdf"
version = "0.1.0"
description = "Edição de arquivos PDF: mesclar, separar, ordenar páginas, OCR e conversão para Markdown"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "Pillow>=10.0",
    "pymupdf>=1.24",
    "click>=8.1",
]

[project.scripts]
edicao-pdf = "edicao_pdf.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["edicao_pdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
